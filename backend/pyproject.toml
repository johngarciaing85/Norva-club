[project]
name = "norva-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "psycopg[binary]>=3",
    "alembic>=1.13",
    "pwdlib[argon2]>=0.2",
    "slowapi>=0.1",
    "python-multipart>=0.0.9",
    "jinja2>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
