services:
  - type: web
    name: norva-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: norva-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://norvaclub.com","https://www.norvaclub.com"]'
      - key: FRONTEND_URL
        value: https://norvaclub.com
      - key: COOKIE_DOMAIN
        value: .norvaclub.com
      - key: CLOUDINARY_URL
        sync: false
      - key: PORT
        value: "8000"

databases:
  - name: norva-db
    plan: free
    region: oregon
    databaseName: norva_db
    user: norva_prod
